const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=i=>document.getElementById(i);
$("ver").addEventListener("change",()=>{$("p").type=$("ver").checked?"text":"password";});
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!window.crypto||!crypto.subtle||!window.TextEncoder){$("m").textContent="Este navegador n\u00e3o consegue abrir a p\u00e1gina. Use o Chrome ou o Safari atualizados.";return;}
  $("b").disabled=true;$("b").textContent="Abrindo...";$("m").textContent="";
  try{
    const senha=$("p").value.trim().replace(/[\u2010-\u2015\u2212]/g,"-");
    const cs=crypto.subtle,base=await cs.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveBits"]);
    const km=new Uint8Array(await cs.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u(D.s),iterations:D.i},base,512));
    const v=u(D.v),c=u(D.c),msg=new Uint8Array(v.length+c.length);msg.set(v);msg.set(c,v.length);
    const mk=await cs.importKey("raw",km.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
    if(!await cs.verify("HMAC",mk,u(D.t),msg)) throw new Error("senha");
    const ek=await cs.importKey("raw",km.slice(0,32),"AES-CBC",false,["decrypt"]);
    const txt=new TextDecoder().decode(await cs.decrypt({name:"AES-CBC",iv:v},ek,c));
    document.open();document.write(txt);document.close();
  }catch(x){
    $("m").textContent=x&&x.message==="senha"?"Senha incorreta. Confira e tente de novo.":"N\u00e3o foi poss\u00edvel abrir a p\u00e1gina. Recarregue e tente de novo.";
    $("b").disabled=false;$("b").textContent="Entrar";$("p").focus();
  }
});
