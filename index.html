const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const $=i=>document.getElementById(i);
const limpa=s=>s.trim().replace(/[\u2010-\u2015\u2212]/g,"-");
const junta=(a,b)=>{const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r;};
async function abre(km,v,c,t){
  const cs=crypto.subtle;
  const mk=await cs.importKey("raw",km.slice(32,64),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  if(!await cs.verify("HMAC",mk,t,junta(v,c))) throw new Error("senha");
  const ek=await cs.importKey("raw",km.slice(0,32),"AES-CBC",false,["decrypt"]);
  return new Uint8Array(await cs.decrypt({name:"AES-CBC",iv:v},ek,c));
}
$("ver").addEventListener("change",()=>{$("p").type=$("ver").checked?"text":"password";});
$("f").addEventListener("submit",async e=>{
  e.preventDefault();
  if(!window.crypto||!crypto.subtle||!window.TextEncoder){$("m").textContent="Este navegador n\u00e3o consegue abrir a p\u00e1gina. Use o Chrome ou o Safari atualizados.";return;}
  $("b").disabled=true;$("b").textContent="Abrindo...";$("m").textContent="";
  try{
    const cs=crypto.subtle,te=new TextEncoder();
    const quem=limpa($("us").value).toLowerCase().replace(/\s+/g,"-");
    const h=new Uint8Array(await cs.digest("SHA-256",te.encode(D.h+":"+quem)));
    const alvo=btoa(String.fromCharCode.apply(null,h));
    const a=D.a.find(x=>x.u===alvo);
    if(!a) throw new Error("senha");
    const base=await cs.importKey("raw",te.encode(limpa($("p").value)),"PBKDF2",false,["deriveBits"]);
    const km=new Uint8Array(await cs.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:u(a.s),iterations:D.i},base,512));
    const cofre=await abre(km,u(a.v),u(a.k),u(a.t));
    const conteudo=await abre(cofre.slice(0,64),u(D.v),u(D.c),u(D.t));
    window.__casal=new TextDecoder().decode(cofre.slice(64));
    document.open();document.write(new TextDecoder().decode(conteudo));document.close();
  }catch(x){
    $("m").textContent=x&&x.message==="senha"?"Usu\u00e1rio ou senha incorretos.":"N\u00e3o foi poss\u00edvel abrir a p\u00e1gina. Recarregue e tente de novo.";
    $("b").disabled=false;$("b").textContent="Entrar";$("p").focus();
  }
});
})();
